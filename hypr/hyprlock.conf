# ---------------- Поле ввода ----------------
input-field {
    monitor               =
    size                  = 20%, 5%
    outline_thickness     = -1
    dots_size             = 0.25               # 0.001 - 0.8
    dots_spacing          = 0.2               # -1.0 - 1.0
    dots_center           = true
    dots_rounding         = -1
    dots_text_format      =                    # напр. *; пусто = скруглённые прямоугольники
    outer_color           = rgba(0, 0, 0, 0)
    inner_color           = rgba(0, 0, 0, 0)
    font_color            = rgba(255, 255, 255, 1.0)
    font_family           = $font
    fade_on_empty         = false
    fade_timeout          = 2000
    placeholder_text      = 
    hide_input            = false
    hide_input_base_color = rgba(153, 170, 187, 1.0)
    rounding              = -1
    check_color           = rgba(204, 136, 34, 1.0)
    check_text            =
    fail_color            = rgba(204, 34, 34, 1.0)
    fail_text             = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color        = rgba(255, 170, 0, 1.0)
    numlock_color         = rgba(0, 170, 255, 1.0)
    bothlock_color        = rgba(255, 0, 170, 1.0)
    invert_numlock        = false
    swap_font_color       = false
    position              = 0%, 0%
    halign                = center
    valign                = center
    zindex                = 0

    shadow_passes = 0
    shadow_size   = 3
    shadow_color  = rgb(0, 0, 0)
    shadow_boost  = 1.2
}


# ---------------- Лейблы ----------------

# Часы (24ч), обновление раз в секунду
label {
    monitor     =
    text        = cmd[update:1000] date +"%H:%M:%S"
    text_align  = center
    color       = rgba(254, 254, 254, 1.0)
    font_size   = 90
    font_family = $font
    rotate      = 0
    position    = -2%, -2%
    halign      = right
    valign      = top
}

# Дата (## экранирует # в цвете внутри pango)
label {
    monitor     =
    text        = cmd[update:60000] echo "<span foreground='##cccccc'>$(date +'%A, %d %B %Y')</span>"
    font_size   = 30
    font_family = $font
    position    = -2%, -11%
    halign      = right
    valign      = top
}

# Раскладка клавиатуры: $LAYOUT[en,ru,de], $LAYOUT[!] скрывает раскладку 0
label {
    monitor   =
    text      = $LAYOUT[en,ru]
    font_size = 30
    font_family = $font
    position  = -2%, 2%
    halign    = right
    valign    = bottom
}

