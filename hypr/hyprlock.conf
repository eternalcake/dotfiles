$font = JetBrainsMonoNL Nerd Font Mono

general {
    hide_cursor        = true
    ignore_empty_input = true
    immediate_render   = false
    text_trim          = true
    fractional_scaling = 2        # 0 = выкл, 1 = вкл, 2 = авто
    screencopy_mode    = 0        # 0 = GPU, 1 = CPU (медленно)
    fail_timeout       = 2000     # мс до сброса UI после неудачной попытки
}

# Нужен хотя бы один включённый метод аутентификации
auth {
    pam {
        enabled = true
        module  = hyprlock
    }
    fingerprint {
        enabled         = false
        ready_message   = (Scan fingerprint to unlock)
        present_message = Scanning fingerprint
        retry_delay     = 250
    }
}

animations {
    enabled = true

    bezier    = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 1.8, linear
    animation = fadeOut, 1, 1.8, linear
    animation = inputFieldColors, 1, 2, linear
    animation = inputFieldFade, 1, 2, linear
    animation = inputFieldWidth, 1, 1.5, linear
    animation = inputFieldDots, 1, 1.5, linear
    # дерево: global > fade (fadeIn, fadeOut), inputField (inputFieldColors,
    # inputFieldFade, inputFieldWidth, inputFieldDots)
}

# ---------------- Фон ----------------
background {
    monitor           =                      # пусто = все мониторы
    path              = screenshot           # путь к png/jpg/webp, screenshot или пусто (тогда color)
    color             = rgba(17, 17, 17, 1.0)
    blur_passes       = 3
    blur_size         = 7
    noise             = 0.0117
    contrast          = 0.8916
    brightness        = 0.8172
    vibrancy          = 0.1696
    vibrancy_darkness = 0.05
    reload_time       = -1                   # сек; 0 = только по SIGUSR2; игнорируется при screenshot
    reload_cmd        =                      # команда, возвращающая новый path
    crossfade_time    = -1.0
    zindex            = -1
}

