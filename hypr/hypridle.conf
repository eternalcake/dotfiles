general {
    # --- команды на события сессии/dbus ---
    lock_cmd         = pidof hyprlock || hyprlock          # dbus lock (loginctl lock-session)
    unlock_cmd       = pkill -USR1 hyprlock && ambxst                # dbus unlock (loginctl unlock-session)
    # on_lock_cmd      = notify-send "Session locked"        # сессия заблокирована lock-приложением
    # on_unlock_cmd    = notify-send "Session unlocked"      # сессия разблокирована
    before_sleep_cmd = loginctl lock-session               # перед сном (dbus prepare_sleep)
    after_sleep_cmd  = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # после пробуждения

    # --- игнорирование инхибиторов ---
    ignore_dbus_inhibit    = false   # dbus-инхибиторы (например, от Firefox)
    ignore_systemd_inhibit = false   # systemd-inhibit --what=idle
    ignore_wayland_inhibit = false   # Wayland idle-inhibit протокол (видеоплееры, браузеры)

    # --- блокировка сна ---
    # 0 = выкл, 1 = ждать before_sleep_cmd, 2 = авто (1 или 3), 3 = ждать блокировки сессии
    inhibit_sleep = 2
}

# 1. Приглушить подсветку экрана
listener {
    timeout    = 300
    on-timeout = brightnessctl -s set 10
    on-resume  = brightnessctl -r
}

# 2. Выключить подсветку клавиатуры
#    ignore_inhibit = true: реагирует, даже если играет видео и держится инхибитор
# listener {
#     timeout        = 300
#     on-timeout     = brightnessctl -sd rgb:kbd_backlight set 0
#     on-resume      = brightnessctl -rd rgb:kbd_backlight
#     ignore_inhibit = true
# }

# 3. Блокировка экрана
listener {
    timeout    = 600
    on-timeout = loginctl lock-session
}

# 4. Выключение дисплея
listener {
    timeout    = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r
}

# 5. Suspend с условием (condition_cmd + condition_retry)
#    can-suspend.sh: exit 0 = можно уснуть, не 0 = отложить
# listener {
#     timeout         = 900
#     on-timeout      = systemctl suspend
#     condition_cmd   = ~/.config/hypr/scripts/can-suspend.sh
