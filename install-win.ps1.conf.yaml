# Only 4 spaces!

- defaults:
    link:
      create: true
      relink: true

- clean: ['~']

- link:
    ~/AppData/Local/nvim: nvim
    ~/AppData/Local/lazygit/config.yml: lazygit/config.yml
    ~/AppData/Local/lazydocker/config.yml: lazydocker/config.yml
    ~/.wslconfig: os/win/.wslconfig
    ~/.gitconfig: os/win/.gitconfig
    ~/.config/komorebi: os/win/komorebi
    ~/.config/whkdrc: os/win/whkdrc
    ~/Documents/PowerShell/Microsoft.PowerShell_profile.ps1: os/win/Microsoft.PowerShell_profile.ps1
