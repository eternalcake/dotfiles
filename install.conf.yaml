# Only 4 spaces!

- defaults:
    link:
      create: true
      relink: true

- clean: ['~']

- link:
    ~/.config/nvim: nvim
    ~/.config/hypr: arch/hypr
    ~/.config/lazygit: lazygit
    ~/.config/lazydocker: lazydocker
    ~/.config/ghostty: arch/ghostty
    ~/.config/btop/btop.conf: arch/btop.conf
    ~/.zshrc: arch/.zshrc
    ~/.config/tmux/tmux.conf: arch/tmux.conf
    ~/.config/clipse/config.json: arch/clipse/config.json
